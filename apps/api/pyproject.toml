[project]
name = "cgu-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
